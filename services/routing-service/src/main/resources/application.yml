server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: routing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeline}
    username: ${DB_USER:lifeline}
    password: ${DB_PASSWORD:lifeline}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      initialization-fail-timeout: -1   # start even if the DB is still booting
  lifecycle:
    timeout-per-shutdown-phase: 10s

routing:
  cache-size: ${ROUTE_CACHE_SIZE:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
